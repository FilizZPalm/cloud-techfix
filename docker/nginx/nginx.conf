server {
    # Listen on port 8080 (>= 1024, no NET_BIND_SERVICE capability required)
    listen 8080;

    server_name _;

    root /var/www/html/public;
    index index.php;

    # Maximum allowed request body size (file uploads, etc.)
    client_max_body_size 10M;

    # ---------------------------------------------------------------------------
    # Static assets — served directly from disk, Laravel is never contacted
    # ---------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|gif|webp|svg|ico|woff|woff2|ttf)$ {
        # Return 404 directly if the file does not exist; do NOT fall through to PHP
        try_files $uri =404;

        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # Main entry point — try real file/directory, fall back to Laravel front controller
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # PHP processing — forward to PHP-FPM running in the laravel-service pod
    # ---------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass  laravel-service:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;

        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
    }

    # ---------------------------------------------------------------------------
    # Security — block access to hidden files/directories
    # Allow .well-known (used by ACME / Let's Encrypt challenges)
    # ---------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
}
